<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 4b - Question 2</title>
</head>
<body>
    <input type="text" id="userInput" placeholder="Enter a number">
    <button onclick="checkInput()">Check</button>

    <script>
        function checkInput() {
            // Retrieve and trim whitespace from the user input
            const rawInput = document.getElementById("userInput").value.trim();
            const num = Number(rawInput);

            // Check if the input is empty or not a valid number
            if (rawInput === "" || isNaN(num)) {
                alert("Please insert a number!");
            } else if (num < 10) {
                alert("The number is lower than 10");
            } else if (num > 10) {
                alert("The number is higher than 10");
            } else {
                alert("The number is equal to 10");
            }
        }
    </script>
</body>
</html>
